<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fluid Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>

    <button id="menuToggle" type="button">☰ Menu</button>

    <aside id="sidebar">
        <h2>Settings</h2>

        <div class="control-group">
            <div class="control-header">
                <span>Tool</span>
            </div>
            <select id="toolSelect">
                <option value="draw">Paint fluid</option>
                <option value="emitter">Place source (emitter)</option>
                <option value="sink">Place drain (sink)</option>
                <option value="vortex">Place vortex</option>
                <option value="eraser">Remove object</option>
            </select>
        </div>

        <div class="control-group">
            <button id="clearObjectsBtn" type="button">Clear all objects</button>
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Fluid type</span>
            </div>
            <select id="fluidTypeSelect">
                <option value="water">Water (fast & splashy)</option>
                <option value="honey">Honey (thick & sluggish)</option>
                <option value="oil">Oil (smooth & flowing)</option>
                <option value="gas">Smoke / gas (rises)</option>
            </select>
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Brush width / size</span>
                <span id="valRadius">3</span>
            </div>
            <input type="range" id="sliderRadius" min="1" max="15" value="3" step="1">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Duration (lifetime)</span>
                <span id="valDissipation">98.5%</span>
            </div>
            <input type="range" id="sliderDissipation" min="0.850" max="0.999" value="0.985" step="0.001">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Brightness</span>
                <span id="valBrightness">1.0</span>
            </div>
            <input type="range" id="sliderBrightness" min="0.1" max="5.0" value="1.0" step="0.1">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Color</span>
            </div>
            <select id="colorSelect">
                <option value="preset">Type default</option>
                <option value="cyan">Cyan</option>
                <option value="purple">Purple</option>
                <option value="green">Green</option>
                <option value="orange">Orange</option>
                <option value="pink">Pink</option>
                <option value="white">White</option>
            </select>
        </div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
